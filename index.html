<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbershop — Запись на услугу</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

<!-- Шапка -->
<header class="header">
    <div class="header-container">
        <a href="#" class="logo">
            <img src="logo.png" alt="Barbershop">
        </a>
        <nav class="navigation">
            <a href="#">Услуги</a>
            <a href="#">Галерея</a>
            <a href="#">Команда</a>
            <a href="#">Отзывы</a>
            <a href="#">Контакты</a>
        </nav>
    </div>
</header>

<!-- Индикатор этапов -->
<div class="steps">
    <div class="steps-container">
        <div class="step">
            <div class="step-number completed">1</div>
            <div class="step-line"></div>
        </div>
        <div class="step">
            <div class="step-number completed">2</div>
            <div class="step-line"></div>
        </div>
        <div class="step">
            <div class="step-number active">3</div>
            <div class="step-line"></div>
        </div>
        <div class="step">
            <div class="step-number">4</div>
            <div class="step-line"></div>
        </div>
        <div class="step">
            <div class="step-number">5</div>
        </div>
    </div>
</div>

<!-- Основная часть -->
<section class="booking">
    <div class="booking-container">
        <div class="booking-title">
            <a href="#" class="back-button">‹</a>
            <h1>Дата и время</h1>
        </div>

        <div class="booking-content">
            <!-- Календарь -->
            <div class="calendar">
                <div class="calendar-header">
                    <h2 id="calendar-month-title">Июнь 2025</h2>
                    <div class="calendar-controls">
                        <button class="calendar-arrow" id="prev-month" aria-label="Предыдущий месяц">‹</button>
                        <button class="calendar-arrow" id="next-month" aria-label="Следующий месяц">›</button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Дни недели и числа генерируются через JS -->
                </div>
            </div>

            <!-- Выбор времени -->
            <div class="time-section">
                <h2>Доступное время</h2>
                <div class="time-grid" id="time-grid">
                    <!-- Слоты генерируются через JS -->
                </div>
            </div>
        </div>

        <!-- Нижняя панель сводки -->
        <div class="booking-summary" id="booking-summary">
            <div class="booking-summary-info">
                <span class="booking-summary-date" id="summary-date">—</span>
                <span class="booking-summary-time" id="summary-time">время не выбрано</span>
            </div>
        </div>

        <!-- Кнопка Далее -->
        <div class="booking-actions">
            <button class="next-button" id="next-button">Далее</button>
        </div>
    </div>
</section>

<!-- Подвал -->
<footer class="footer">
    <div class="footer-container">
        <div class="footer-main">
            <div class="footer-logo">
                <img src="logo-footer.png" alt="Barbershop">
            </div>
            <div class="footer-contacts">
                <h2>Контакты</h2>
                <p><span class="contact-icon">⌖</span> ул. Садовая, 15, Москва</p>
                <p><span class="contact-icon">☎</span> +7 (495) 123-45-67</p>
            </div>
            <div class="footer-hours">
                <h3>Режим работы</h3>
                <p>Пн–Пт: 9:00 – 21:00</p>
                <p>Сб–Вс: 10:00 – 19:00</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>© 2026. Все права защищены.</p>
            <a href="#">Политика конфиденциальности</a>
        </div>
    </div>
</footer>

<script src=".js"></script>
</body>
</html>
